[package]
name = "ai-technical-readout"
version = "1.0.0"
description = "AI Technical Readout"
authors = ["Quick AI LLC"]
edition = "2021"

[lib]
name = "ai_technical_readout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
